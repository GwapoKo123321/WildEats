<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WildEats{% endblock %}</title>
    <style>
        :root {
            --bg: #f3f6fb;
            --surface: #ffffff;
            --surface-soft: #eef4ff;
            --text: #172033;
            --muted: #6b7892;
            --line: #dbe3f0;
            --blue: #4f7cff;
            --teal: #27c2b5;
            --yellow: #ffd86b;
            --shadow: 0 18px 40px rgba(23, 32, 51, 0.08);
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 14px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(79, 124, 255, 0.12), transparent 24%),
                radial-gradient(circle at 85% 10%, rgba(39, 194, 181, 0.12), transparent 24%),
                var(--bg);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .shell {
            width: min(1100px, calc(100% - 2rem));
            margin: 0 auto;
            padding: 1.25rem 0 3rem;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 1rem 1.2rem;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-weight: 800;
        }

        .brand-mark {
            width: 2.75rem;
            height: 2.75rem;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: #fff;
            background: linear-gradient(135deg, var(--blue), var(--teal));
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
        }

        .nav-links a,
        .button,
        button {
            min-height: 44px;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--surface);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .button,
        button {
            color: #fff;
            border-color: transparent;
            background: linear-gradient(135deg, var(--blue), var(--teal));
        }

        .button.secondary {
            color: var(--text);
            background: var(--surface);
            border-color: var(--line);
        }

        .hero,
        .panel,
        .card,
        .order-card,
        .empty-state,
        .shape-panel,
        .mini-list li {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
        }

        .hero {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 1.2rem;
            padding: 1.4rem;
        }

        .hero-copy {
            display: grid;
            align-content: center;
            gap: 1rem;
        }

        .eyebrow {
            display: inline-block;
            width: fit-content;
            padding: 0.4rem 0.7rem;
            border-radius: 999px;
            background: var(--surface-soft);
            color: var(--blue);
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        h1,
        h2,
        h3 {
            margin: 0;
            line-height: 1.05;
        }

        h1 {
            font-size: clamp(2.3rem, 5vw, 4.6rem);
        }

        h2 {
            font-size: clamp(1.8rem, 4vw, 3rem);
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .hero-actions,
        .stack {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .hero-art,
        .shape-panel {
            position: relative;
            overflow: hidden;
            min-height: 280px;
        }

        .hero-art {
            background: #111827;
        }

        .hero-art::before,
        .shape-panel::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            top: 24px;
            left: 24px;
            border-radius: 28px;
            background: var(--blue);
        }

        .hero-art::after,
        .shape-panel::after {
            content: "";
            position: absolute;
            width: 210px;
            height: 210px;
            right: -30px;
            bottom: -30px;
            border-radius: 50%;
            background: var(--teal);
        }

        .shape-panel .shape-three {
            position: absolute;
            width: 120px;
            height: 120px;
            left: 50%;
            top: 52%;
            transform: translate(-50%, -50%) rotate(45deg);
            border-radius: 24px;
            background: var(--yellow);
        }

        .grid {
            display: grid;
            gap: 1rem;
        }

        .grid.stats {
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        }

        .card,
        .panel {
            padding: 1.25rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
        }

        .stat-label {
            margin-top: 0.35rem;
            font-size: 0.92rem;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 1rem;
            margin: 1.6rem 0 1rem;
        }

        .order-list {
            display: grid;
            gap: 1rem;
        }

        .order-card {
            display: grid;
            gap: 1rem;
            padding: 1.2rem;
        }

        .order-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            padding: 0.4rem 0.7rem;
            border-radius: 999px;
            background: var(--surface-soft);
            color: var(--blue);
            font-size: 0.78rem;
            font-weight: 800;
        }

        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.9rem;
        }

        .mini-list {
            display: grid;
            gap: 0.7rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .mini-list li {
            padding: 0.9rem 1rem;
            border-radius: var(--radius-md);
            background: var(--surface-soft);
        }

        .empty-state {
            padding: 2rem;
            text-align: center;
        }

        form {
            display: grid;
            gap: 1rem;
        }

        form p {
            display: grid;
            gap: 0.45rem;
            color: var(--text);
        }

        label {
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
            color: var(--text);
            font: inherit;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--blue);
        }

        ul.errorlist {
            margin: 0;
            padding: 0;
            list-style: none;
            color: #c13d5a;
            font-size: 0.92rem;
        }

        .login-layout {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 1.2rem;
        }

        .shape-panel {
            background: #fff;
        }

        @media (max-width: 860px) {
            .hero,
            .login-layout,
            .split {
                grid-template-columns: 1fr;
            }

            .shell {
                width: min(100% - 1rem, 1100px);
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <nav class="nav">
            <a class="brand" href="/">
                <span class="brand-mark">WE</span>
                <span>WildEats</span>
            </a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/sales/">Sales</a>
                <a href="/login/">Login</a>
            </div>
        </nav>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
