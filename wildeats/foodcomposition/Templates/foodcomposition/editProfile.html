<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile - WildEats</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #fff; display: flex; flex-direction: column; min-height: 100vh; }
        .stripe { height: 10px; }
        .nav { background: #fff; padding: 16px 5vw; display: flex; align-items: center; justify-content: space-between; }
        .nav-logo { color: #6B0F1A; font-size: 22px; font-weight: 700; }
        .nav-links { display: flex; align-items: center; gap: 8px; }
        .btn-home { background: #fff; color: #6B0F1A; padding: 10px 20px; border-radius: 30px; font-size: 14px; font-weight: 600; text-decoration: none; border: 1.5px solid transparent; transition: border-color 0.2s; }
        .btn-home:hover { background: #6B0F1A; color: #FFD700; }
        .btn-logout { background: #6B0F1A; color: #FFD700 !important; padding: 10px 20px !important; border-radius: 30px !important; font-weight: 600; border: 1.5px solid transparent !important; cursor: pointer; font-size: 14px; font-family: 'Poppins', sans-serif; transition: border-color 0.2s; text-decoration: none; display: inline-block; }
        .btn-logout:hover { background: #8a1020 !important; }
        .btn-back { background: #fff; color: #6B0F1A; padding: 10px 20px; border-radius: 30px; font-size: 14px; font-weight: 600; text-decoration: none; border: 1.5px solid transparent; transition: border-color 0.2s; }
        .btn-back:hover { background: #6B0F1A; color: #FFD700; }
        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 16px; }
        .card { background: #fff; border: 1px solid #f0e0a0; border-radius: 16px; padding: 40px; width: 100%; max-width: 480px; box-shadow: 0 8px 40px rgba(107,15,26,0.08); }
        .avatar { width: 72px; height: 72px; background: #6B0F1A; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 16px; }
        .card-title { color: #6B0F1A; font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 4px; }
        .card-role { color: #000000; font-size: 12px; text-align: center; margin-bottom: 28px; text-transform: uppercase; letter-spacing: 1px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #6B0F1A; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 11px 14px; border: 1.5px solid #f0e0a0; border-radius: 8px; font-size: 13px; font-family: 'Poppins', sans-serif; outline: none; background: #fdfaf4; box-sizing: border-box; transition: border-color 0.2s; }
        .btn { width: 100%; background: #6B0F1A; color: #FFD700; padding: 14px; border: none; border-radius: 30px; font-size: 14px; font-weight: 600; font-family: 'Poppins', sans-serif; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #8a1020; }
        .footer { background: #6B0F1A; color: rgba(255,215,0,0.7); text-align: center; padding: 20px 5vw; font-size: 12px; }
    </style>
</head>
<body>
<div class="stripe"></div>
<div class="nav">
    <div class="nav-logo">WildEats</div>
    <div class="nav-links">
        {% if user.role == 'admin' %}
            <a class="btn-back" href="{% url 'admin-dashboard' %}">Back</a>
        {% endif %}
        <a class="btn-home" href="{% url 'home' %}">Home</a>
        <button class="btn-logout" onclick="openModal()">Logout</button>
    </div>
</div>
<div class="container">
    <div class="card">
        <div class="avatar">👤</div>
        <div class="card-title">Edit Profile</div>
        <div class="card-role">{{ user.role }}</div>
        <form method="POST">
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="Fname" value="{{ user.Fname }}">
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="Lname" value="{{ user.Lname }}">
                </div>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" value="{{ user.username }}">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ user.email }}">
            </div>
            <button class="btn" type="submit">Save Changes</button>
        </form>
    </div>
</div>
<!--<div class="footer">WildEats &copy; 2026 — Campus Cafeteria System</div>-->
<div class="stripe"></div>

<div id="logout-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:999; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:16px; padding:36px; max-width:360px; width:90%; text-align:center;">
        <h3 style="color:#6B0F1A; font-size:18px; font-weight:600; margin-bottom:10px;">Logging Out</h3>
        <p style="color:#aaa; font-size:13px; margin-bottom:24px;">Are you sure you want to log out?</p>
        <div style="display:flex; gap:12px; justify-content:center;">
            <button onclick="closeModal()" style="padding:10px 24px; border:1.5px solid #f0e0a0; background:#fff; border-radius:8px; font-size:13px; cursor:pointer; color:#6B0F1A; font-weight:500; font-family:'Poppins',sans-serif;">Cancel</button>
            <a href="{% url 'logout' %}" style="padding:10px 24px; background:#6B0F1A; color:#FFD700; border-radius:8px; font-size:13px; font-family:'Poppins',sans-serif; text-decoration:none; font-weight:600;">Yes, Logout</a>
        </div>
    </div>
</div>
<script>
function openModal() { document.getElementById('logout-modal').style.display = 'flex'; }
function closeModal() { document.getElementById('logout-modal').style.display = 'none'; }
</script>
</body>
</html>
