{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WildEats - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #fff; display: flex; flex-direction: column; min-height: 100vh; }
        .stripe { height: 10px; }
        .nav { background: #fff; padding: 16px 5vw; display: flex; align-items: center; justify-content: space-between; }
        .nav-logo { color: #6B0F1A; font-size: 22px; font-weight: 700; }
        .nav-links { display: flex; align-items: center; gap: 8px; }
        .btn-home { background: #fff; color: #6B0F1A; padding: 10px 20px; border-radius: 30px; font-size: 14px; font-weight: 600; text-decoration: none; border: 1.5px solid transparent; transition: border-color 0.2s; }
        .btn-home:hover { background: #6B0F1A; color: #FFD700; }
        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 16px; background: #fff; }
        .split { display: flex; width: 100%; max-width: 900px; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 40px rgba(107,15,26,0.10); }
        .split-left { background: #6B0F1A; padding: 48px 36px; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 40%; text-align: center; }
        .split-left h2 { color: #FFD700; font-size: 26px; font-weight: 700; margin-bottom: 12px; }
        .split-left p { color: rgba(255,215,0,0.7); font-size: 13px; line-height: 1.8; }
        .split-left .logo { font-size: 48px; margin-bottom: 16px; }
        .split-right { background: #fff; padding: 48px 40px; flex: 1; }
        .form-title { color: #6B0F1A; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .form-sub { color: #aaa; font-size: 13px; margin-bottom: 28px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 500; color: #6B0F1A; margin-bottom: 6px; }
        input { width: 100%; padding: 11px 14px; border: 1.5px solid #f0e0a0; border-radius: 8px; font-size: 14px; font-family: 'Poppins', sans-serif; outline: none; background: #fdfaf4; transition: border-color 0.2s; }
        input:focus { border-color: #6B0F1A; background: #fff; }
        .btn { width: 100%; background: #6B0F1A; color: #FFD700; padding: 10px 20px; border-radius: 30px; font-size: 14px; font-weight: 600; text-decoration: none; border: 1.5px solid transparent; font-family: 'Poppins', sans-serif; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
        .btn:hover { background: #8a1020; }
        .error { color: #c0392b; font-size: 13px; text-align: center; margin-top: 12px; background: #ffeaea; padding: 10px; border-radius: 8px; }
        .bottom-link { text-align: center; margin-top: 20px; font-size: 13px; color: #aaa; }
        .bottom-link a { color: #6B0F1A; font-weight: 600; text-decoration: none; }
        .container {
        background-image: url("{% static 'foodcomposition/bg.jpg' %}");
        background-size: 90%;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        position: relative;
        border-radius: 20px;
        margin: -5px 5vw;
        overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.90) 0%,
                rgba(255, 255, 255, 0.30) 50%,
                rgba(255, 255, 255, 0) 75%
            );
            pointer-events: none;
        }
        .container > * { position: relative; z-index: 1; }
        .footer { background: #6B0F1A; color: rgba(255,215,0,0.7); text-align: center; padding: 20px 5vw; font-size: 12px; }
        @media (max-width: 600px) { .split { flex-direction: column; } .split-left { width: 100%; padding: 28px; } }
    </style>
</head>
<body>
<div class="stripe"></div>
<div class="nav">
    <div class="nav-logo">WildEats</div>
    <div class="nav-links"><a class="btn-home" href="{% url 'home' %}">Home</a></div>
</div>

<div class="container">
    <div class="split">
        <div class="split-left">
            <div class="logo"></div>
            <h2>WildEats</h2>
            <p>Your campus cafeteria management system. Login to continue.</p>
        </div>
        <div class="split-right">
            <div class="form-title">Welcome Back</div>
            <div class="form-sub">Login to access your account</div>
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Enter your username" autofocus>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter your password">
                </div>
                <button class="btn" type="submit">Login</button>
            </form>
            {% if error %}<p class="error">{{ error }}</p>{% endif %}
            <div class="bottom-link">Don't have an account? <a href="{% url 'register' %}">Register here</a></div>
        </div>
    </div>
</div>
<div class="stripe"></div>
</body>
</html>
