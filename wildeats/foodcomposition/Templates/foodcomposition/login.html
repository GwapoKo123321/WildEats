<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WildEats - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #fdfaf4; display: flex; flex-direction: column; min-height: 100vh; }
        .stripe { height: 5px; background: #FFD700; }
        .nav { background: #6B0F1A; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
        .nav-logo { color: #FFD700; font-size: 20px; font-weight: 600; letter-spacing: 1px; }
        .nav-links a { color: rgba(255,215,0,0.75); font-size: 13px; text-decoration: none; }
        .nav-links a:hover { color: #FFD700; }
        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 16px; }
        .card { background: #fff; border: 1px solid #f0e0a0; border-radius: 12px; padding: 40px 36px; width: 100%; max-width: 400px; }
        .card-title { color: #6B0F1A; font-size: 22px; font-weight: 600; margin-bottom: 6px; text-align: center; }
        .card-sub { color: #aaa; font-size: 13px; text-align: center; margin-bottom: 28px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 500; color: #6B0F1A; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 14px; border: 1px solid #f0e0a0; border-radius: 6px; font-size: 14px; font-family: 'Poppins', sans-serif; outline: none; }
        input:focus { border-color: #FFD700; }
        .btn { width: 100%; background: #6B0F1A; color: #FFD700; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; font-family: 'Poppins', sans-serif; cursor: pointer; margin-top: 8px; }
        .btn:hover { background: #7A0E1E; }
        .error { color: #c0392b; font-size: 13px; text-align: center; margin-top: 12px; }
        .footer { background: #6B0F1A; color: rgba(255,215,0,0.6); text-align: center; padding: 16px; font-size: 12px; }
    </style>
</head>
<body>

<div class="stripe"></div>
<div class="nav">
    <div class="nav-logo">WildEats</div>
    <div class="nav-links">
        <a href="/">Home</a>
    </div>
</div>

<div class="container">
    <div class="card">
        <div class="card-title">Welcome Back</div>
        <div class="card-sub">Login to access WildEats</div>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password">
            </div>
            <button class="btn" type="submit">Login</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</div>

<div class="footer">WildEats &copy; 2026 — Campus Cafeteria System</div>
<div class="stripe"></div>

</body>
</html>
