<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Ingredient Record</title>
    <style>
        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            background: linear-gradient(135deg, #f9f2e7 0%, #fffdf9 46%, #eef5ef 100%);
            color: #132238;
        }
        .container {
            max-width: 720px;
            margin: 40px auto;
            padding: 28px;
            border-radius: 18px;
            background: rgba(255, 250, 243, 0.92);
            box-shadow: 0 16px 40px rgba(19, 34, 56, 0.12);
        }
        h1 { margin-top: 0; }
        form p { margin: 12px 0; }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(19, 34, 56, 0.2);
            border-radius: 10px;
            background: #fff;
            font: inherit;
        }
        .actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }
        button, a {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 999px;
            text-decoration: none;
            border: none;
            font: inherit;
            cursor: pointer;
        }
        button {
            background: #132238;
            color: #fffaf3;
        }
        a {
            background: #c9862b;
            color: #fffaf3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add New Ingredient Record</h1>
        <p>Submit this form to create a new ingredient record.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="actions">
                <button type="submit">Save Ingredient</button>
                <a href="{% url 'index' %}">Back to Index</a>
            </div>
        </form>
    </div>
</body>
</html>
