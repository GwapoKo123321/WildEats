<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WildEats | Add Cafeteria</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: white; padding: 40px; border-radius: 8px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1abc9c; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 20px; }
        button:hover { background: #16a085; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #7f8c8d; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #34495e; }

        /* Custom layout styling for the new time picker clocks */
        .time-picker-container { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
        .time-picker-container input[type="time"] { margin: 0; cursor: pointer; }
        .time-label { font-size: 14px; color: #34495e; font-weight: bold; display: block; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 style="margin-top: 0; color: #2c3e50;">Add New Cafeteria</h2>
        <form method="post" id="cafeteriaForm">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Save Record</button>
        </form>
        <a href="{% url 'index' %}" class="back-link">Back to Dashboard</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Find the original operating hours text field generated by Django
            const originalHoursInput = document.getElementById("id_operating_hours");

            if (originalHoursInput) {
                // 1. Hide the original plain text input box
                originalHoursInput.style.display = "none";

                // 2. Create a clean wrapper for our dual clock pickers
                const clockWrapper = document.createElement("div");
                clockWrapper.className = "time-picker-container";
                clockWrapper.innerHTML = `
                    <input type="time" id="openingClock" required>
                    <span style="color: #7f8c8d; font-weight: bold;">to</span>
                    <input type="time" id="closingClock" required>
                `;

                // 3. Insert the clocks right where the text box used to be
                originalHoursInput.parentNode.insertBefore(clockWrapper, originalHoursInput.nextSibling);

                const openingClock = document.getElementById("openingClock");
                const closingClock = document.getElementById("closingClock");

                // Helper function to turn 24h clock values (e.g., "14:30") into standard AM/PM (e.g., "2:30 PM")
                function convertTo12Hour(timeString) {
                    if (!timeString) return "";
                    let [hours, minutes] = timeString.split(":");
                    hours = parseInt(hours);
                    const ampm = hours >= 12 ? "PM" : "AM";
                    hours = hours % 12;
                    hours = hours ? hours : 12; // Converts '0' hours to '12'
                    return `${hours}:${minutes} ${ampm}`;
                }

                // 4. Automatically combine and format the values whenever a clock changes
                function syncOperatingHours() {
                    if (openingClock.value && closingClock.value) {
                        const formattedOpen = convertTo12Hour(openingClock.value);
                        const formattedClose = convertTo12Hour(closingClock.value);
                        originalHoursInput.value = `${formattedOpen} - ${formattedClose}`;
                    } else {
                        originalHoursInput.value = "";
                    }
                }

                openingClock.addEventListener("input", syncOperatingHours);
                closingClock.addEventListener("input", syncOperatingHours);
            }
        });
    </script>
</body>
</html>
