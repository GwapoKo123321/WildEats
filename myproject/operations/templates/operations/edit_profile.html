<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WildEats | Edit Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #fdfaf4; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .form-container { background: white; padding: 40px; border-radius: 16px; width: 400px; box-shadow: 0 8px 30px rgba(107,15,26,0.1); border: 1px solid #f0e0a0; }
        h2 { color: #6B0F1A; margin-bottom: 20px; text-align: center; }

        /* Matching the form styling from your Add forms */
        p { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #6B0F1A; font-size: 13px; }
        input { width: 100%; padding: 12px; border: 1.5px solid #f0e0a0; border-radius: 8px; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        .btn-update { width: 100%; padding: 12px; background: #6B0F1A; color: #FFD700; border: none; border-radius: 30px; cursor: pointer; font-weight: 600; font-family: 'Poppins', sans-serif; transition: 0.2s; margin-top: 10px; }
        .btn-update:hover { background: #8a1020; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #aaa; text-decoration: none; font-size: 13px; }
        .back-link:hover { color: #6B0F1A; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Edit Your Profile</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-update">Update Profile</button>
        </form>
        <a href="{% url 'index' %}" class="back-link">Cancel</a>
    </div>
</body>
</html>
