<!DOCTYPE html>
<html>
<head>
    <title>WildEats | Home</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f7f6; }
        nav { background: #2c3e50; padding: 15px; color: white; display: flex; gap: 20px; }
        nav a { color: white; text-decoration: none; font-weight: bold; }
        .container { padding: 30px; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <nav>
        <span>WildEats Operations</span>
        <!-- Required Navigation Links -->
        <a href="{% url 'edit_profile' %}">Edit Profile</a>
        <a href="{% url 'add_cafeteria' %}">Add New Record (Cafeteria)</a>
        <a href="{% url 'add_report' %}">Add New Record (Report)</a>
        <a href="{% url 'logout' %}" style="margin-left: auto; color: #e74c3c;">Log Off</a>
    </nav>

    <div class="container">
        <h1>Welcome, {{ user.username }}</h1>
        <div class="card">
            <h3>Recent Activities</h3>
            <p>Your session is active. You are managed under the Operations Functional Area.</p>
        </div>
    </div>
</body>
</html>
